<menu class="flex justify-center p-5 md:p-0">
  <nav
    class="flex md:py-10 justify-between gap-2 sm:gap-4 md:gap-8 text-lg sm:text-xl menu"
  >
    <div class="flex gap-6 md:gap-12 shrink w-full">
      <a
        [routerLink]="['']"
        routerLinkActive="router-link-active"
        class="hover:text-white text-gray-400 animated-underline items-center hidden sm:flex"
        >Home
      </a>
      <a
        [routerLink]="['/browse']"
        routerLinkActive="router-link-active"
        class="hover:text-white text-gray-400 animated-underline items-center hidden sm:flex"
      >
        Browse
      </a>
      <button
        class="hover:text-white text-gray-400 items-center sm:hidden flex"
        alt="Toggle menu"
        aria-label="Open or close the menu"
        (click)="toggleMenu()"
      >
        @if (!isMobileMenuOpen) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18 18 6M6 6l12 12"
            />
          </svg>
        }
      </button>
    </div>

    <div class="relative flex items-center">
      <input
        type="text"
        placeholder="Search..."
        (input)="onInputChange($event)"
        class="rounded-xl pl-10 h-8 text-white text-sm border-0 searchbar"
        (click)="handleType()"
      />
      <span
        class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
      </span>
    </div>

    <a
      [routerLink]="['/wishlist']"
      routerLinkActive="router-link-active"
      class="hover:text-white text-gray-400 animated-underline text-center items-center md:flex hidden"
      >Wishlist</a
    >
  </nav>
</menu>
