@if (listedGame) {
  <main class="flex justify-center px-5 md:px-0" id="listedGame">
    <div id="game">
      <h1 class="text-3xl font-bold sm:text-4xl w-full py-3 md:pb-10">
        {{ chosenGame?.name }}
      </h1>
      <div class="md:flex md:justify-between gap-8">
        <img
          class="rounded-xl md:w-3/5 lg:w-4/6 xl:w-9/12 object-cover game-cover"
          src="{{ chosenGame?.horizontalsrc }}"
          alt="Game cover"
        />
        <div
          class="flex justify-end items-center md:w-2/5 gap-4 relative flex-col-reverse md:flex-col"
        >
          <div class="flex flex-col w-full py-2 gap-2">
            <span class="flex justify-between w-full">
              <span class="text-veryLightGray"> Title: </span>
              <span class=""> {{ chosenGame?.name }}</span></span
            >
            <span class="flex justify-between w-full">
              <span class="text-veryLightGray"> Release Date: </span>
              <span class=""> {{ chosenGame?.releaseDate }}</span></span
            >
            <span class="flex justify-between w-full">
              <span class="text-veryLightGray"> Genre: </span>
              <span class=""> {{ chosenGame?.genre }}</span></span
            >
            <span class="flex justify-between w-full">
              <span class="text-veryLightGray"> Publisher: </span>
              <span>{{ chosenGame?.publisher }}</span></span
            >
            <span class="flex justify-between w-full">
              <span class="text-veryLightGray"> Developer: </span>
              <span class="">{{ chosenGame?.developer }}</span></span
            >
          </div>
          <div class="flex gap-2 flex-col justify-end w-full">
            <span
              class="w-full text-center pt-2 md:text-start md:flex md:justify-between text-lg"
            >
              <span class="text-veryLightGray">Price: </span>
              <span class="">${{ chosenGame?.price }}</span>
            </span>

            <button
              [routerLink]="['pay']"
              class="w-full h-12 rounded-lg transitio text-white text-lg px-4 buy-button"
            >
              Buy Now
            </button>
            <button
              class="w-full h-12 rounded-lg bg-gray-900 bg-zinc-700 hover:bg-zinc-600 transition text-lg px-4 wishlist-button"
              (click)="likeOrDislikeGame()"
            >
              @if (isChosenGameLiked) {
                Remove from Wishlist
              } @else {
                Add to Wishlist
              }
            </button>
          </div>
        </div>
      </div>
      <p class="py-6 text-veryLightGray">
        {{ chosenGame?.description }}
      </p>
    </div>
  </main>
}
<loading-spinner></loading-spinner>
